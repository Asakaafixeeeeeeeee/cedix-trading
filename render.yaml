# Render Blueprint — deploy CediX with one click ("New +" → "Blueprint" in Render)
# Docs: https://render.com/docs/blueprint-spec
#
# Region note: Binance's public API blocks US IPs, so keep the service in
# frankfurt or singapore for live market data.

databases:
  - name: cedix-db
    region: frankfurt
    plan: basic-256mb # upgrade for production traffic
    postgresMajorVersion: "16"

services:
  - type: web
    name: cedix
    runtime: node
    region: frankfurt
    plan: starter # "free" works for testing (service sleeps when idle; uploads are ephemeral)
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/fx
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cedix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      # ── PAYTELLER live payments ──────────────────────────────────────────
      # Non-secret identifiers (safe to keep in this file):
      - key: PAYTELLER_API_BASE_URL
        value: https://paytelller.com/api/v1
      - key: PAYTELLER_MERCHANT_ID
        value: TTM-44546097
      - key: PAYTELLER_USERNAME
        value: pt_ttm-44546097
      # SECRETS — set these two in the Render dashboard (Environment tab),
      # never in this file or in chat. Until both are set the platform stays
      # in sandbox mode and live deposits are disabled.
      - key: PAYTELLER_API_KEY
        sync: false
      - key: PAYTELLER_WEBHOOK_SECRET
        sync: false
      # ── Email (Resend) ───────────────────────────────────────────────────
      - key: EMAIL_FROM
        value: CediX Trading <noreply@cedixtrading.com>
      # SECRET — set in the Render dashboard. Emails stay in the outbox
      # (QUEUED) until this is configured.
      - key: RESEND_API_KEY
        sync: false
    # Persistent storage for Orbit media uploads (requires a paid instance).
    # Without a disk, uploads are lost on each deploy/restart.
    disk:
      name: cedix-uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1
